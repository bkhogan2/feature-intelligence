[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "app-starter-core"
version = "0.1.0"
description = "Reusable workspace and authentication foundation extracted from GI Triage"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.139,<0.140", "uvicorn>=0.51,<0.52", "pwdlib[argon2]>=0.3,<0.4", "psycopg[binary,pool]>=3.3,<4"]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.2.176,<0.3"]
google = ["firebase-admin>=7.5,<8"]
dev = ["pytest>=9.1,<10", "httpx2>=2.5,<3", "ruff>=0.15.20,<0.16"]
billing = [
    "stripe>=14,<15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app_core"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
